<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="c1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#00c8ff"/></linearGradient>
  <linearGradient id="c2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#bf5af2"/><stop offset="100%" stop-color="#9b3fce"/></linearGradient>
  <linearGradient id="c3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff375f"/><stop offset="100%" stop-color="#e02040"/></linearGradient>
  <linearGradient id="c4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7ee787"/><stop offset="100%" stop-color="#4ec46e"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>text{font-family:'Fira Code','Courier New',monospace}</style>
<rect width="1000" height="90" rx="14" fill="#0b0f1a" stroke="#1f2a44" stroke-width="1.5"/>
<!-- PHP bar -->
<text x="28" y="30" font-size="12" fill="#8b9bb4">PHP</text>
<rect x="28" y="38" width="0" height="8" rx="4" fill="url(#c1)"><animate attributeName="width" from="0" to="220" dur="1.5s" fill="freeze"/></rect>
<text x="255" y="49" font-size="11" fill="#00f0ff">55%</text>
<!-- JS bar -->
<text x="28" y="68" font-size="12" fill="#8b9bb4">JavaScript</text>
<rect x="28" y="76" width="0" height="8" rx="4" fill="url(#c2)"><animate attributeName="width" from="0" to="96" dur="1.5s" begin="0.2s" fill="freeze"/></rect>
<text x="130" y="87" font-size="11" fill="#bf5af2">24%</text>
<!-- HTML/CSS bar -->
<text x="310" y="30" font-size="12" fill="#8b9bb4">HTML / CSS</text>
<rect x="310" y="38" width="0" height="8" rx="4" fill="url(#c3)"><animate attributeName="width" from="0" to="52" dur="1.5s" begin="0.4s" fill="freeze"/></rect>
<text x="368" y="49" font-size="11" fill="#ff375f">13%</text>
<!-- C++ bar -->
<text x="310" y="68" font-size="12" fill="#8b9bb4">C++</text>
<rect x="310" y="76" width="0" height="8" rx="4" fill="url(#c4)"><animate attributeName="width" from="0" to="24" dur="1.5s" begin="0.6s" fill="freeze"/></rect>
<text x="340" y="87" font-size="11" fill="#7ee787">6%</text>
<!-- Stat badges -->
<rect x="610" y="16" width="100" height="58" rx="10" fill="#0f1626" stroke="#00f0ff" stroke-opacity="0.3"/>
<text x="660" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#00f0ff" filter="url(#glow)">20+</text>
<text x="660" y="58" text-anchor="middle" font-size="10" fill="#8b9bb4">CCTV Installed</text>
<rect x="730" y="16" width="100" height="58" rx="10" fill="#0f1626" stroke="#bf5af2" stroke-opacity="0.3"/>
<text x="780" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#bf5af2" filter="url(#glow)">3+</text>
<text x="780" y="58" text-anchor="middle" font-size="10" fill="#8b9bb4">Certifications</text>
<rect x="850" y="16" width="110" height="58" rx="10" fill="#0f1626" stroke="#ff375f" stroke-opacity="0.3"/>
<text x="905" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#ff375f" filter="url(#glow)">2026</text>
<text x="905" y="58" text-anchor="middle" font-size="10" fill="#8b9bb4">BNSP Certified</text>
</svg>
